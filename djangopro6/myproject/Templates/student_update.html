<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>update student</title>
</head>
<body>
    <h1>Update student</h1>

    <form method="POST">

        {% csrf_token %}

        <label>name</label>

        <input
            type="text"
            name="name"
            value="{{ student.name }}"
        >

        <br><br>

        <label>age</label>
        <input
            type="number"
            name="age"
            value="{{ student.age}}"
        >

        <br><br>

         <label>Email:</label>

        <input
            type="email"
            name="email"
            value="{{ student.email }}"
        >

        <br><br>

        <button type="submit">
            Update
        </button>

    </form>

    <br>

    <a href="{% url 'student_list' %}">
        Back
    </a>

</body>
</html>

    </form>
    
</body>
</html>
