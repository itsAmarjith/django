<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student management</title>
</head>
<body>
    <h1>STUDENT Management System</h1>

    <a href="{% url 'student_create' %}">
        Add Student
    </a>

    <br><br>

    <table border="1" cellpadding="10">

        <tr>
            <th>id</th>
            <th>name</th>
            <th>age</th>
            <th>email</th>
            <th>Actions</th>

        </tr>

        {% for student in students %}

        <tr>
            <td>{{ student.id }}</td>
            <td>{{ student.name }}</td>
            <td>{{ student.age }}</td>
            <td>{{ student.email }}</td>

            <td>
                <a href="{% url 'student_update' student.id %}">
                    Edit
                </a>

                <a href="{% url 'student_delete' student.id %}">
                    Delete
                </a>
            </td>


        </tr>

        {% empty %}

        <tr>
            <td colspan="5">
                No students found
            </td>
        </tr>

        {% endfor %}


    </table>
</body>
</html>
