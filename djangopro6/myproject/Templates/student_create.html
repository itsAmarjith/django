<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADD Student</title>
</head>
<body>
    <h1>Add Student</h1>

    <form method="post">

        {% csrf_token %}

        <label>name:</label>
        <input type="text" name="name">

        <br><br>

        <label>age:</label>
        <input type="age" name="age">

        <br><br>

        <label>email</label>
        <input type="email" name="email">
        
        <br><br>

        <button type="submit">
            save
        </button>
    </form>

    <br>

    <a href="{% url 'student_list' %}">
        Back
    </a>
    
</body>
</html>
