{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details</title>
</head>
<style>
        table {
            width: 70%;
            border-collapse: collapse;
            margin: 30px auto;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid #000;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>

<body>

    <h1>Student Details</h1>

    <table>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Email</th>
            <th>place</th>
            <th>college</th>
            <th>image</th>
        </tr>
        {% for i in stud %}
        <tr>
            <td>{{ i.name }}</td>
            <td>{{ i.age }}</td>
            <td>{{ i.email }}</td>
            <td>{{ i.place }}</td>
            <td>{{ i.college }}</td>
            <td>
                {% if i.image %}
                <img src="{{ i.image.url }}" alt="{{ i.name }}">
                {% else %}
                no image
                {% endif %}
            </td>
        </tr>
        {% endfor %}

    </table>

</body>
</html>
